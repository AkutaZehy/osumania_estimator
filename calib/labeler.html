<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AKUTA 标定工具</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --card: #23262e; --line: #333845;
    --fg: #e8eaf0; --dim: #9aa1b0; --accent: #4fc3f7; --ok: #66bb6a;
    --warn: #ffa726; --vibro: #ab47bc; --err: #ef5350;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  #drop { position: fixed; inset: 0; background: rgba(20,22,26,.92); display: none; align-items: center; justify-content: center; z-index: 50; font-size: 22px; color: var(--accent); border: 3px dashed var(--accent); }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; }
  .btn { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: #2b3a52; border-color: var(--accent); }
  .spacer { flex: 1; }
  .stat { color: var(--dim); font-size: 13px; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; padding: 14px 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: var(--accent); }
  .card .name { font-weight: 600; font-size: 13px; margin-bottom: 4px; word-break: break-all; }
  .card .sub { color: var(--dim); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; border: 1px solid var(--line); }
  .b-pending { color: var(--dim); }
  .b-done { color: var(--ok); border-color: var(--ok); }
  .b-vibro { color: var(--vibro); border-color: var(--vibro); }
  .ktype { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .ktype b { color: var(--fg); font-weight: 600; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 40; }
  #modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(620px, 94vw); max-height: 90vh; overflow: auto; padding: 20px 24px; }
  #modal h2 { font-size: 15px; margin-bottom: 2px; }
  #modal .meta { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  #modal .meta a { color: var(--accent); text-decoration: none; }
  .kv { display: grid; grid-template-columns: 64px 1fr; gap: 3px 10px; font-size: 13px; margin: 6px 0; }
  .kv .k { color: var(--dim); }
  .section { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  .section h3 { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .struct { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; font-size: 12px; }
  .chip b { color: var(--fg); }
  .chip .pct { color: var(--accent); }
  .vibro-flag { color: var(--vibro); font-weight: 600; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 12px; }
  .form label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  .form input[type=number], .form input[type=text] { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 6px; color: var(--fg); padding: 6px 9px; font-size: 14px; }
  .form input:focus { outline: none; border-color: var(--accent); }
  .checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
  .checkbox input { width: 16px; height: 16px; accent-color: var(--accent); }
  .hint { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .converted { color: var(--ok); font-size: 12px; min-height: 18px; }
  .disabled { opacity: .4; pointer-events: none; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  #nav { display: flex; gap: 6px; align-items: center; margin-top: 8px; padding: 0 18px; }
  #nav .btn { padding: 3px 9px; font-size: 12px; }
  #nav .sel { background: #2b3a52; border-color: var(--accent); }
  .empty { color: var(--dim); text-align: center; margin-top: 60px; font-size: 15px; }
  .empty .btn { margin-top: 14px; }
</style>
</head>
<body>

<div id="drop">拖放 scan.json 到此处</div>

<header>
  <h1>AKUTA 标定工具</h1>
  <button class="btn primary" id="loadScan">载入 scan.json</button>
  <button class="btn" id="loadLabels">载入 labels.json</button>
  <button class="btn" id="exportBtn">导出 labels.json</button>
  <span class="spacer"></span>
  <span class="stat" id="statLine">未载入数据</span>
</header>

<div id="nav">
  <span class="stat">排序:</span>
  <button class="btn sel" data-sort="est">估计难度</button>
  <button class="btn" data-sort="sunny">sunny</button>
  <button class="btn" data-sort="name">名称</button>
  <span class="spacer"></span>
  <span class="stat">筛选:</span>
  <button class="btn" data-filter="all">全部</button>
  <button class="btn" data-filter="pending">未标注</button>
  <button class="btn" data-filter="done">已标注</button>
  <button class="btn" data-filter="ln">LN 图</button>
</div>

<div id="list"></div>

<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);

const state = { scan: null, labels: {}, sort: "est", filter: "all", current: null };

// ---------- persistence ----------
function saveLS() { try { localStorage.setItem("akutalabel", JSON.stringify(state.labels)); } catch {} }
function loadLS() {
  try { const v = localStorage.getItem("akutalabel"); if (v) state.labels = JSON.parse(v) || {}; } catch {}
}

// ---------- label value helpers ----------
function labelOf(md5) { return state.labels[md5] || null; }
function isDone(m) {
  const l = labelOf(m.md5);
  if (!l) return false;
  if (l.isvibro) return true;
  if (l.isLN) return l.RC != null && l.LN != null;
  return l.RC != null;
}
function danConvert(v) {
  if (v == null || v === "" || !Number.isFinite(Number(v))) return "";
  const n = Number(v);
  const base = Math.round(n);
  const frac = n - base;
  let sub = frac <= -0.125 ? "low" : frac <= 0.125 ? "mid" : "high";
  return `${base} ${sub}（= ${n.toFixed(2)}）`;
}

// ---------- scan.json loading ----------
function loadScanFile(file) {
  file.text().then((text) => {
    try {
      state.scan = JSON.parse(text);
      state.sort = "est"; state.filter = "all";
      render();
    } catch (e) { alert("scan.json 解析失败: " + e.message); }
  });
}
function loadLabelsFile(file) {
  file.text().then((text) => {
    try {
      const data = JSON.parse(text);
      if (data && data.labels) state.labels = data.labels;
      saveLS(); render();
    } catch (e) { alert("labels.json 解析失败: " + e.message); }
  });
}

// ---------- file pickers / drag&drop ----------
$("#loadScan").onclick = () => { const i = document.createElement("input"); i.type = "file"; i.accept = ".json"; i.onchange = () => i.files[0] && loadScanFile(i.files[0]); i.click(); };
$("#loadLabels").onclick = () => { const i = document.createElement("input"); i.type = "file"; i.accept = ".json"; i.onchange = () => i.files[0] && loadLabelsFile(i.files[0]); i.click(); };
$("#exportBtn").onclick = exportLabels;

document.addEventListener("dragover", (e) => { e.preventDefault(); $("#drop").style.display = "flex"; });
document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) $("#drop").style.display = "none"; });
document.addEventListener("drop", (e) => {
  e.preventDefault(); $("#drop").style.display = "none";
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  if (f.name.includes("labels")) loadLabelsFile(f); else loadScanFile(f);
});

function exportLabels() {
  const payload = { version: 1, estimator: state.scan ? state.scan.estimator : "akutav0", labels: state.labels };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "labels.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- list ----------
function estSortKey(m) {
  const v = m.est.mode === "ln" ? (m.est.ln ?? 0) : (m.est.rc ?? 0);
  return v || 0;
}
function filtered() {
  if (!state.scan) return [];
  let arr = [...state.scan.maps];
  const f = state.filter;
  if (f === "pending") arr = arr.filter((m) => !isDone(m));
  else if (f === "done") arr = arr.filter((m) => isDone(m));
  else if (f === "ln") arr = arr.filter((m) => m.lnRatio > 0.15);
  if (state.sort === "est") arr.sort((a, b) => estSortKey(a) - estSortKey(b));
  else if (state.sort === "sunny") arr.sort((a, b) => a.sunny - b.sunny);
  else arr.sort((a, b) => (a.title + a.version).localeCompare(b.title + b.version));
  return arr;
}
function render() {
  if (!state.scan) {
    $("#list").innerHTML = `<div class="empty">拖放或点击「载入 scan.json」<br><span class="stat">（在 calib/ 目录运行 <b>npm run calib:scan</b> 生成）</span></div>`;
    $("#statLine").textContent = "未载入数据";
    return;
  }
  const maps = filtered();
  const done = state.scan.maps.filter((m) => isDone(m)).length;
  $("#statLine").textContent = `共 ${state.scan.maps.length} 张 · 已标注 ${done} 张 · 排序:${state.sort} · 筛选:${state.filter}`;
  $("#list").innerHTML = maps.map(cardHtml).join("");
  for (const btn of document.querySelectorAll("#nav .btn")) {
    btn.classList.toggle("sel", btn.dataset.sort === state.sort || btn.dataset.filter === state.filter);
  }
}
function cardHtml(m) {
  const est = m.est;
  const estText = est.mode === "vibro" ? "VIBRO" : (est.mode === "ln" ? `RC ${fmt(est.rc)} / LN ${fmt(est.ln)}` : `RC ${fmt(est.rc)}`);
  const done = isDone(m);
  const badge = m.vibro.isVibro ? `<span class="badge b-vibro">VIBRO</span>` : (done ? `<span class="badge b-done">已标注</span>` : `<span class="badge b-pending">未标注</span>`);
  const structs = m.structures;
  const jack = structs.jack[0], stream = structs.stream[0], ln = structs.ln[0];
  const kline = [
    jack ? `J: <b>${jack.keyType}</b> @${jack.bpm}bpm ${jack.pct}%` : "",
    stream ? `S: <b>${stream.keyType}</b> @${stream.bpm}bpm ${stream.pct}%` : "",
    ln ? `L: <b>${ln.keyType}</b> @${ln.bpm}bpm ${ln.pct}%` : "",
  ].filter(Boolean).join(" · ");
  return `<div class="card" data-md5="${m.md5}">
    <div class="name">${esc(m.title)} <span style="color:var(--dim)">[${esc(m.version)}]</span></div>
    <div class="sub">
      <span>sunny ${m.sunny.toFixed(2)}</span><span>${m.bpm}bpm</span><span>LN ${(m.lnRatio * 100).toFixed(0)}%</span>
      <span style="color:var(--accent)">${estText}</span>${badge}
    </div>
    <div class="ktype">${kline}</div>
  </div>`;
}
function fmt(v) { return v == null ? "—" : v.toFixed(2); }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

// ---------- modal ----------
$("#list").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) openModal(card.dataset.md5);
});

function openModal(md5) {
  const m = state.scan.maps.find((x) => x.md5 === md5);
  if (!m) return;
  state.current = m;
  const l = labelOf(md5) || {};
  const link = m.beatmapId > 0
    ? `<a href="https://osu.ppy.sh/beatmapsets/${m.setId}#mania/${m.beatmapId}" target="_blank">beatmap #${m.beatmapId}（set #${m.setId}）</a>`
    : `<span>本地图（无 BeatmapID）</span>`;
  const est = m.est;
  const estHtml = est.mode === "vibro"
    ? `<span class="vibro-flag">VIBRO（算法判定，无需标定数值）</span>`
    : (est.mode === "ln"
      ? `RC ${fmt(est.rc)} · LN ${fmt(est.ln)}（${danConvert(est.ln)}）`
      : `RC ${fmt(est.rc)}（${danConvert(est.rc)}）`);

  $("#modalBox").innerHTML = `
    <h2>${esc(m.artist)} - ${esc(m.title)} [${esc(m.version)}]</h2>
    <div class="meta">${esc(m.file)}<br>${link}</div>
    <div class="kv">
      <span class="k">sunny</span><span>${m.sunny.toFixed(2)} 星</span>
      <span class="k">BPM</span><span>${m.bpm}</span>
      <span class="k">时长</span><span>${m.durationSec}s</span>
      <span class="k">LN 比</span><span>${(m.lnRatio * 100).toFixed(1)}%</span>
    </div>
    <div class="section">
      <h3>键型结构（键型 @bpm · 占比）</h3>
      <div class="struct">
        ${structChips(m.structures.jack, "JACK")}
        ${structChips(m.structures.stream, "STREAM")}
        ${structChips(m.structures.ln, "LN")}
      </div>
    </div>
    <div class="section">
      <h3>VIBRO 判定</h3>
      <div>${m.vibro.isVibro ? `<span class="vibro-flag">${esc(m.vibro.label)}</span>` : `<span style="color:var(--dim)">${esc(m.vibro.label || "No Vibro")}</span>`}</div>
    </div>
    <div class="section">
      <h3>当前估计（akutav0，用于校准参考）</h3>
      <div>${estHtml}</div>
    </div>
    <div class="section">
      <h3>标定（仅需 4 个值）</h3>
      <div class="checkbox"><input type="checkbox" id="fVibro" ${l.isvibro ? "checked" : ""}><span>isvibro（勾选则无视其余所有标定值）</span></div>
      <div class="checkbox"><input type="checkbox" id="fLN" ${l.isLN ? "checked" : ""}><span>isLN（勾选则需同时填 RC 与 LN）</span></div>
      <div class="form">
        <div><label>RC（0-20，例：3 low → 2.75）</label><input type="number" id="fRC" min="0" max="20" step="0.05" value="${l.RC ?? ""}"><div class="converted" id="rcConv"></div></div>
        <div><label>LN</label><input type="number" id="fLNv" min="0" max="20" step="0.05" value="${l.LN ?? ""}"><div class="converted" id="lnConv"></div></div>
        <div style="grid-column:1/-1"><label>备注</label><input type="text" id="fNote" value="${esc(l.note || "")}" placeholder="可选"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="btnCancel">取消</button>
      <button class="btn" id="btnClear">清除标注</button>
      <button class="btn primary" id="btnSave">保存</button>
    </div>`;
  $("#modal").style.display = "flex";
  syncForm();
  $("#fRC").oninput = () => { $("#rcConv").textContent = danConvert($("#fRC").value); };
  $("#fLNv").oninput = () => { $("#lnConv").textContent = danConvert($("#fLNv").value); };
  $("#fVibro").onchange = syncForm;
  $("#fLN").onchange = syncForm;
  $("#btnCancel").onclick = closeModal;
  $("#btnSave").onclick = saveModal;
  $("#btnClear").onclick = () => { delete state.labels[m.md5]; saveLS(); closeModal(); render(); };
}
function structChips(list, tag) {
  if (!list || list.length === 0) return `<span class="chip" style="color:var(--dim)">${tag}: —</span>`;
  return `<span class="chip">${tag}:</span>` + list.map((s) =>
    `<span class="chip"><b>${esc(s.keyType)}</b> @${s.bpm}bpm <span class="pct">${s.pct}%</span></span>`).join("");
}
function syncForm() {
  const vibro = $("#fVibro").checked;
  const ln = $("#fLN").checked;
  $("#fRC").parentElement.classList.toggle("disabled", vibro);
  $("#fLNv").parentElement.classList.toggle("disabled", vibro);
  $("#fNote").parentElement.classList.toggle("disabled", vibro);
  $("#rcConv").textContent = vibro ? "VIBRO：忽略数值" : danConvert($("#fRC").value);
  $("#lnConv").textContent = vibro ? "" : (ln ? danConvert($("#fLNv").value) : "未启用（非 LN 图）");
}
function saveModal() {
  const m = state.current;
  const vibro = $("#fVibro").checked;
  const isLN = !vibro && $("#fLN").checked;
  let RC = null, LN = null;
  if (!vibro) {
    if ($("#fRC").value !== "") RC = Number($("#fRC").value);
    if ($("#fLNv").value !== "") LN = Number($("#fLNv").value);
    if (isLN && (RC == null || LN == null)) { alert("isLN 需同时填写 RC 与 LN"); return; }
    if (!isLN && RC == null) { alert("请填写 RC（或勾选 isvibro）"); return; }
  }
  state.labels[m.md5] = { isvibro: vibro, isLN, RC, LN, note: $("#fNote").value.trim() };
  saveLS();
  closeModal();
  render();
}
function closeModal() { $("#modal").style.display = "none"; }

// ---------- nav ----------
document.querySelectorAll("#nav .btn").forEach((btn) => {
  btn.onclick = () => {
    if (btn.dataset.sort) state.sort = btn.dataset.sort;
    if (btn.dataset.filter) state.filter = btn.dataset.filter;
    render();
  };
});

// ---------- boot ----------
loadLS();
render();
</script>
</body>
</html>
